# Development-standards policy for this repository.
#
# This file is committed: it carries policy, so it travels with the repository.
# It must never carry an endpoint, an API key, or the name of the variable
# holding one — those are machine state and the loader refuses them here.
# See docs/adr/0006-configuration-split-policy-and-machine.md.
#
# A project names providers; only a machine defines how to reach them. Which
# provider reviews your code is your choice, so this framework names none. To
# add a locally reachable reviewer, define the provider and the backend on your
# machine:
#
#   mf config set providers.<name>.endpoint <url> --machine
#   mf config set providers.<name>.api_key_env <VAR> --machine
#   mf config set providers.<name>.kind openai-compatible --machine
#   mf config set backends.<name>.kind api --machine
#   mf config set backends.<name>.provider <name> --machine
#   mf config set backends.<name>.model <id> --machine
#
# <VAR> is the NAME of the environment variable holding the key, never the key.
# `mf init --provider <name> --endpoint <url> --api-key-env <VAR>` does the same
# at activation time, and names the backend in the R2 chain in one step.
#
# Then decide who puts it in the chain. This file does, for everyone who clones
# the repository — add the name to `[roles.r2]` below and commit it. A machine
# chain (`mf config set roles.r2.backends ... --machine`) applies only to a role
# this file leaves undeclared, because a machine may not review a repository
# with a chain that repository did not choose; for one run, and only for the
# person running it, `MF_ROLES_R2_BACKENDS=codex,gemini,<name> mf review --role r2`.

version = 1

# --- paths --------------------------------------------------------------------

# Where the gates look. These are the built-in defaults, restated because an
# adopter who keeps these standards elsewhere — as a submodule, say — changes
# them here and nowhere else. Every value is resolved against the repository
# root and may not leave it, and there is no machine layer for them: where a
# repository keeps its documents is the same fact on every clone.
[paths]
standards = "docs/standards"
specs = "docs/specs"
adr = "docs/adr"
agents_source = "docs/agents/instructions.md"
agents_file = "AGENTS.md"

[review]
base = "main"
effort = "high"

# --- roles -------------------------------------------------------------------

# R1 carries no provider constraint: what defines it is when it runs and how
# much of the change it sees. superpowers is one backend of this chain, not the
# layer itself (docs/adr/0010-r1-provider-constraint-is-per-backend.md).
[roles.r1]
backends = ["superpowers"]

# R2 is the only role that carries the cross-provider requirement.
#
# `blocking` is deliberately left undeclared. Every review layer is advisory per
# ai_guidelines.md, so the built-in answer is already the one this repository
# wants for everybody; leaving the key out is also what lets a machine or a
# single run raise the bar without editing committed policy, which a declared
# `blocking = false` here would forbid. Three ways to turn it on, in the order
# the loader applies them, so each line outranks the one above it:
#
#   mf config set roles.r2.blocking true --machine   # this machine, always
#   blocking = true                                  # every clone, once committed
#   MF_ROLES_R2_BLOCKING=1 git push                  # this push only
#
# With it on, a finding a reviewer classed as blocking stops the pre-push hook.
# A finding it classed as advisory does not, and neither does a chain where no
# backend was available — a reviewer that never ran is not a finding, and an
# expired quota must not be able to lock the repository.
[roles.r2]
backends = ["codex", "agy", "gemini"]
require_cross_provider = true

# R3 runs in CI on the pull request, where the intent is written down. On this
# repository it is CodeRabbit, wired through its GitHub app: declared here so
# the review-layers line can name it, executed elsewhere, and never claimed as
# observed (docs/specs/0022-r3-in-ci-with-pull-request-posting.md). Append a
# reachable reviewer ahead of it on a machine or in CI to have the chain
# actually run one; until one is there, R3 reports that it did not run rather
# than passing quietly.
[roles.r3]
backends = ["coderabbit"]

# The CRUX explainer is a role like every other, so which model explains a
# change is configuration rather than a second setting nobody remembers exists.
# Only a prompt-driven backend can serve it: an agentic reviewer answers with a
# review, and `mf explain` asks for an explainer.
[roles.explain]
backends = ["gemini"]

# --- backends ----------------------------------------------------------------

# A machine may define backends of its own, under the same key space. A name
# defined here wins over a machine definition of that name, whole rather than
# field by field, so a machine adds backends and never substitutes one this
# file already chose.

# Runs inside a coding-agent session, so it cannot be started as a subprocess.
# It contributes an attestation; an absent session counts as unavailable.
[backends.superpowers]
kind = "in-session"
provider = "anthropic"

# Agentic: explores the repository itself, and finds AGENTS.md on disk.
[backends.codex]
kind = "cli"
provider = "openai"
command = "codex"
# ADR 0004 pinned this default on benchmark; it is per-backend so a fallback
# never inherits it.
model = "gpt-5.6-terra"
args = [
  "review",
  "--base", "{{.Base}}",
  "-c", "model={{.Model}}",
  "-c", "model_reasoning_effort={{.Effort}}",
]
unavailable_patterns = [
  "usage limit", "rate limit", "quota",
  "not logged in", "please (run )?codex login", "unauthorized", "401", "403",
  "network error", "connection (refused|reset)",
]

# Also agentic, but prompt-driven rather than repository-reading, so the role
# instructions and the diff are handed to it through {{.Prompt}}.
# Antigravity's CLI. Prompt-driven like gemini, so the role instructions and the
# diff are handed to it through {{.Prompt}}.
#
# It is a gateway rather than a vendor: the same command reaches Google,
# Anthropic and open models, so which vendor actually reviews depends entirely
# on the model pinned below. That is why the provider says `google` and the
# model is a Gemini one — a Claude model here would satisfy the cross-provider
# rule against an Anthropic Author by name while being the same vendor in
# substance, which is the failure that rule exists to prevent.
#
# The effort is baked into the model id (`-high`, `-low`), so --effort is not
# passed: two settings for one dial is a way to have them disagree.
[backends.agy]
kind = "cli"
provider = "google"
command = "agy"
model = "gemini-3.1-pro-high"
args = ["--print", "{{.Prompt}}", "--model", "{{.Model}}"]
# It answers with the findings schema the role prompt asks for, so its
# severities survive and `mf eval` can score it against the corpus. A backend
# that stops answering that way has its prose recorded, not read as clean.
structured = true
unavailable_patterns = [
  "quota", "rate limit", "resource[_ ]exhausted",
  "not authenticated", "unauthorized", "401", "403",
  "network error", "connection (refused|reset)",
]

[backends.gemini]
kind = "cli"
provider = "google"
command = "gemini"
args = ["--prompt", "{{.Prompt}}"]
unavailable_patterns = [
  "quota", "rate limit", "resource[_ ]exhausted",
  "not authenticated", "unauthorized", "401", "403",
  "network error", "connection (refused|reset)",
]

# Runs as a forge app rather than as anything this tool starts, so it is
# declared and recorded but never executed here. That is a weaker claim than any
# other backend makes — configuration says a reviewer is wired, nothing observed
# a review — and the chain treats it as unavailable so it reads as such.
[backends.coderabbit]
kind = "external"
provider = "coderabbit"

# --- checks ------------------------------------------------------------------

# What counts as trivial, as an explicit path list rather than a heuristic or a
# model. It is crude on purpose: a gate nobody can predict is a gate people
# route around, and widening this list is visible in review.
[checks]
exempt_paths = [
  "README.md",
  "LICENSE",
  ".gitignore",
  ".gitattributes",
  "docs/adr/*",
  "docs/specs/*",
]

# The surfaces docs/standards/design.md governs. The explainer's stylesheet is
# inline in its renderer, so the Go file is the surface.
design_surfaces = [
  "internal/explain/render.go",
]

# --- agent instruction files --------------------------------------------------

# Generated from docs/agents/instructions.md. Roles are declared, not derived
# from the backend chains: the Author is a per-branch declaration rather than a
# chain, so there is nothing to derive it from.
[agents.claude]
file = "CLAUDE.md"
roles = ["shared", "author"]

[agents.codex]
file = "AGENTS.md"
roles = ["shared", "reviewer"]
