name: ci

# What a commit and a pull request are held to. The list of checks is not here:
# it lives in gate.yml, which release.yml calls as well, so the bar a tag has
# to clear and the bar main has to clear are the same object rather than two
# lists that agree until someone edits one of them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
