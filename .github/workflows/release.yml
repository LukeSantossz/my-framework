name: release

# Builds the binary for every supported platform on a version tag and publishes
# it with checksums. The standards tree stays a runtime-free directory in this
# repository, so an adopter consuming it as a submodule needs no binary at all;
# the two artifacts are deliberately separate.

on:
  push:
    tags: ["v*"]

# Read by default. Only the job that uploads the release asks for more, so a
# job added later has to state its own need rather than inherit write.
permissions:
  contents: read

jobs:
  gate:
    # The same gate main is held to, called rather than restated. This job used
    # to be a shorter list of its own — no gofmt check, no shell suites, one
    # platform — which meant a tag could publish exactly what a commit would
    # have been rejected for.
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` uploads the assets, and that is the only write this
      # job makes.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Off for the release build alone. GitHub neither signs nor verifies
          # cache contents, and a cache visible to a tag run is an input to the
          # binaries this job publishes and people download. The gate that runs
          # before this one caches freely: it proves the tree, and nothing it
          # produces is shipped.
          cache: false

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # The version is stamped in rather than read at run time, so a binary
          # always reports the tag it was built from even when it is copied
          # somewhere with no git history.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="mf_${TAG}_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X github.com/LukeSantossz/my-framework/internal/version.Version=${TAG}" \
              -o "dist/${name}${ext}" ./cmd/mf
          done

      # The linker silently ignores -X when the symbol path does not resolve:
      # a renamed package, a moved module path or a typo above produces an exit
      # code of 0 and binaries that all report 0.0.0-dev. Nothing else in this
      # workflow ever runs one, so the stamping was unverified from the day it
      # was written. The native build is executed here and asked what version
      # it thinks it is, before anything is checksummed or uploaded.
      - name: Version smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          binary="dist/mf_${TAG}_linux_amd64"
          if ! out="$("./$binary" doctor)"; then
            echo "the freshly built $binary could not run \`mf doctor\`:"
            printf '%s\n' "$out"
            exit 1
          fi
          # doctor names the build on its first line, which is the only place
          # the binary reports its own version.
          reported="${out%%$'\n'*}"
          if [ "$reported" != "mf ${TAG}" ]; then
            echo "$binary reports \"$reported\", expected \"mf ${TAG}\"."
            echo "The -X symbol path in the build step no longer names a real"
            echo "variable, so the version was never stamped in."
            exit 1
          fi
          echo "$binary reports $reported"

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      # Creating the release and filling it are separate, and each step is safe
      # to repeat. `gh release create` with the assets inline deletes the
      # release it just made if any upload fails, so one flaky upload discarded
      # a build that had passed every gate and left the tag published with
      # nothing behind it. Re-running could not fix it either: the next attempt
      # collided with whatever had already uploaded.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # --verify-tag: a tag that does not resolve must fail here rather
            # than create a release for a version nobody can check out.
            gh release create "$TAG" --generate-notes --verify-tag
          else
            echo "release $TAG already exists; uploading into it"
          fi
          for asset in dist/*; do
            uploaded=""
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" --clobber; then
                uploaded=yes
                break
              fi
              echo "::warning::uploading $asset failed (attempt $attempt of 3)"
              sleep $((attempt * 15))
            done
            if [ -z "$uploaded" ]; then
              echo "::error::$asset could not be uploaded after 3 attempts"
              exit 1
            fi
          done

  edition:
    # Publishes the sec-free edition (spec 0052): the documents-only tree for
    # environments where no framework executable may run. It is cut from the
    # tagged commit, after the release it belongs to is out, and committed as
    # the next commit of the orphan `secfree` branch, so a clone of that branch
    # alone carries no Go code, hook or script. Its tag is `secfree-<tag>`,
    # which the `v*` trigger above never matches.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Pushing the edition branch and its tag is the only write this job makes.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Off for the reason the build job gives: what this job builds is
          # published.
          cache: false

      # The build refuses a tree that still names the binary, a hook, a vendor
      # backend or a standard the edition leaves out, so what reaches the
      # branch is what `mf check edition` already held main to.
      - name: Build the edition
        run: go run ./cmd/mf edition build secfree --out "$RUNNER_TEMP/secfree"

      - name: Publish the edition
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          edition_tag="secfree-${TAG}"
          remote="https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git_auth() { git -c "http.https://github.com/.extraheader=${auth}" "$@"; }

          # Safe to re-run: once this release's edition tag exists, the edition
          # is out, and a second commit for the same release would be noise.
          if git_auth ls-remote --exit-code --tags "$remote" "refs/tags/${edition_tag}" >/dev/null; then
            echo "${edition_tag} already exists; the edition for ${TAG} is published"
            exit 0
          fi

          # The branch has no history in common with main. Its first commit
          # has no parent; every later one has the previous edition as parent.
          parent=""
          if git_auth ls-remote --exit-code --heads "$remote" secfree >/dev/null; then
            git_auth fetch --no-tags --depth=1 "$remote" secfree
            parent="$(git rev-parse FETCH_HEAD)"
          fi

          export GIT_INDEX_FILE="$RUNNER_TEMP/secfree.index"
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$RUNNER_TEMP/secfree" \
            -C "$RUNNER_TEMP/secfree" add --all .
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit="$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "docs(edition): publish the sec-free edition of ${TAG}")"

          git_auth push "$remote" "${commit}:refs/heads/secfree" "${commit}:refs/tags/${edition_tag}"
          echo "published ${edition_tag} at ${commit}"
